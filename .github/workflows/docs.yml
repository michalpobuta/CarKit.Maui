name: Documentation site

# Stage 10: the documentation site on GitHub Pages. The owner enables Pages (Settings → Pages → Source: GitHub Actions) and runs
# the workflow manually from main after a successful release (docs/release-checklist.md): not from a tag, because the github-pages
# environment usually allows only the default branch, and the site must not be published from the tag of a failed release or an RC.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android --version 10.0.204.1

      # The API reference is generated from the Release libraries (iOS and Android), so the build needs the workloads
      - name: Build documentation
        run: eng/docs/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
